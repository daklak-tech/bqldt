name: Cập nhật dashboard di tích hằng ngày

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện đọc Excel
        run: python -m pip install --upgrade openpyxl

      - name: Cập nhật dashboard từ Google Sheet
        run: python update_dashboard_from_sheet.py --index index.html

      - name: Commit nếu có số liệu mới
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Tự động cập nhật số liệu dashboard"
          file_pattern: index.html
